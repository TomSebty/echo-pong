apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
  namespace: ping-pong
  labels:
    app.kubernetes.io/name: ping-pong
    app.kubernetes.io/component: server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ping-pong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ping-pong
        app.kubernetes.io/component: server
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - arm64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ping-pong
          image: ghcr.io/TomSebty/echo-pong:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: SECRET_FILE_PATH
              value: /var/run/secrets/pingpong/token
          volumeMounts:
            - name: app-secret
              mountPath: /var/run/secrets/pingpong
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          # Delay SIGTERM so endpoints are drained before the process stops (distroless + /bin/sleep).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          # App sleeps 10s before ListenAndServe — startupProbe covers that window.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: app-secret
          secret:
            secretName: ping-pong-secret
            items:
              - key: token
                path: token
            defaultMode: 0440
