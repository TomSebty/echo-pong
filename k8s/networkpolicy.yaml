apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ping-pong
  namespace: ping-pong
  labels:
    app.kubernetes.io/name: ping-pong
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ping-pong
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
